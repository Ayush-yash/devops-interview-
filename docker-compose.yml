version: '3.8'

services:
  # MongoDB database service
  db:
    image: mongo:6.0
    container_name: devops-platform-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-dev-data:/data/db
    networks:
      - devops-network

  # Backend API application service
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: devops-platform-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://db:27017/ai-devops-interview
      - JWT_SECRET=compose_local_development_jwt_secret_key_32_chars
      - ANTHROPIC_API_KEY=your_anthropic_api_key_here # Replace with real key locally
    depends_on:
      - db
    networks:
      - devops-network

  # Frontend single-page application service
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: devops-platform-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - devops-network

volumes:
  mongo-dev-data:

networks:
  devops-network:
    driver: bridge
